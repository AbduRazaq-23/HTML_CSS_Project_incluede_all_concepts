<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Personal profile card of Abdu Razaq, MERN Stack Developer"
    />
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <article class="profile-card">
        <!-- HEADER  -->

        <header class="profile-header">
          <span class="profile-label">PROFILE</span>
          <img
            class="profile-image"
            src="/1.Personal Profile Card/assets/img.png"
            alt="Profile photo of Abdu Razaq"
          />
          <h1>Abdu Razaq</h1>
          <p class="role">MERN Stack Developer</p>
        </header>

        <!-- SECTION -->

        <section class="profile-content">
          <p class="description">
            Software engineer focused on building modern full-stack web
            applications.
          </p>

          <h2>Skills</h2>

          <ul class="skills">
            <li><span>Node.js</span></li>
            <li><span>React</span></li>
            <li><span>MongoDB</span></li>
          </ul>
        </section>

        <!-- FOOTER  -->

        <footer class="profile-footer">
          <a
            href="https://github.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub
          </a>

          <a
            href="https://linkedin.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            LinkedIn
          </a>
        </footer>
      </article>
    </main>
  </body>
</html>
